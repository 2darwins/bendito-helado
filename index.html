<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bendito Helado POS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    
    body { font-family: Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f9f9f9; }
    header { background: #e91e63; color: white; padding: 8px; text-align: center; font-weight: bold; font-size: 1.1em; }
    
    /* Control de Pedidos Simultáneos / Cuentas */
    .tabs-pedidos { display: flex; background: #333; overflow-x: auto; padding: 3px 5px; gap: 4px; }
    .tab-btn { background: #555; color: white; border: none; padding: 6px 10px; font-size: 0.75em; font-weight: bold; border-radius: 3px; cursor: pointer; white-space: nowrap; }
    .tab-btn.activa { background: #e91e63; color: white; }

    .recibo-top { background: #fff; border-bottom: 2px solid #ddd; height: 95px; overflow-y: auto; padding: 5px 15px; font-family: monospace; font-size: 0.85em; }
    #carrito { list-style: none; padding: 0; margin: 0; }
    #carrito li { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #eee; padding: 4px 0; }
    .contenedor-productos { flex: 1; overflow-y: auto; padding: 10px; }
    #productos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .card { background: #add8e6; border: 1px solid #87ceeb; border-radius: 4px; padding: 3px; text-align: center; height: 105px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .card strong { font-size: 0.6em; line-height: 1; }
    .card img { width: 100%; height: 45px; object-fit: cover; border-radius: 3px; }
    .card span { font-size: 0.75em; }
    .panel-pago { background: #fffde7; padding: 10px; border-top: 2px solid #ffe082; width: 100%; }
    .total-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    
    /* Ajustes para métodos de pago y botones de arriba */
    .pago-metodos { display: flex; gap: 5px; margin-bottom: 8px; width: 100%; }
    .pago-metodos button { flex: 1; min-width: 0; padding: 10px 4px; border: none; border-radius: 5px; color: white; font-weight: bold; font-size: 0.7em; cursor: pointer; text-align: center; }

    /* Ajuste responsivo de las casillas de Efectivo y Transferencia */
    .inputs-pago { display: flex; gap: 8px; margin-bottom: 8px; width: 100%; }
    .input-group { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .input-group label { font-size: 0.65em; font-weight: bold; margin-bottom: 2px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .input-group input { width: 100%; padding: 8px 4px; font-size: 1em; border-radius: 5px; border: 1px solid #ccc; text-align: center; font-weight: bold; }
    
    .btn-cobrar { background: #e91e63; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 1.2em; cursor: pointer; }
    .config-btn { text-align: center; padding: 8px; background: #eee; font-size: 0.8em; cursor: pointer; }
    #config { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; padding:20px; overflow-y:auto; }
    .stat-card { padding: 10px; border-radius: 8px; border-left: 5px solid; }
    
    /* Estilos del contenedor de la promoción */
    .box-promo { border: 2px dashed #ccc; padding: 6px; border-radius: 6px; margin-bottom: 8px; background: #f5f5f5; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .box-promo.activa { background: #e8f5e9; border-color: #4caf50; }
    .btn-promo-toggle { flex: 1; padding: 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em; border: none; cursor: pointer; text-align: center; min-width: 140px; }
  </style>
</head>
<body>

<header>BENDITO HELADO</header>

<!-- BARRA DE PEDIDOS MULTIPLES / CUENTAS SIMULTÁNEAS -->
<div class="tabs-pedidos" id="tabs-pedidos"></div>

<div class="recibo-top">
  <div style="display:flex; justify-content:space-between; font-weight: bold; border-bottom: 1px solid #ccc; margin-bottom: 3px;">
    <span id="titulo-pedido-actual">PEDIDO 1:</span>
    <button onclick="limpiarPedidoActual()" style="background:#ff5252; color:white; border:none; border-radius:3px; padding:1px 6px; font-size:0.8em; cursor:pointer;">Limpiar Cuenta</button>
  </div>
  <ul id="carrito"></ul>
</div>

<div class="contenedor-productos">
  <div id="productos"></div>
</div>

<div class="panel-pago">
  <div class="total-area">
    <span>TOTAL:</span>
    <h2>$<span id="total">0</span></h2>
  </div>
  
  <div class="pago-metodos">
    <button onclick="pagoRapido('Efectivo')" style="background:#4caf50;">EFECTIVO</button>
    <button onclick="pagoRapido('Transferencia')" style="background:#7030a0;">TRANSFERENCIA</button>
    <button onclick="pagoRapido('Mixto')" style="background:#0288d1;">PAGO MIXTO</button>
  </div>

  <div class="inputs-pago">
    <div class="input-group">
      <label>💵 EFECTIVO RECIBIDO</label>
      <input type="number" id="pago-efectivo" placeholder="0" oninput="actualizarCambio()">
    </div>
    <div class="input-group">
      <label>📲 TRANSFERENCIA</label>
      <input type="number" id="pago-transferencia" placeholder="0" oninput="actualizarCambio()">
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 0.9em; font-weight: bold; margin-bottom: 8px; background: #fff; padding: 6px 10px; border-radius: 4px; border: 1px solid #e0e0e0;">
    <div>Falta cubrir: $<span id="pendiente" style="color: #c62828;">0</span></div>
    <div>Cambio: $<span id="cambio" style="color: #2e7d32;">0</span></div>
  </div>
  
  <!-- CONTENEDOR PROMO CON LOTE Y PORCENTAJE CONFIGURABLE -->
  <div id="box-promo" class="box-promo">
    <button id="btn-promo-toggle" onclick="togglePromo()" class="btn-promo-toggle" style="background:#ddd; color:#555;">🔴 PROMO DESACTIVADA</button>
    
    <div style="display:flex; align-items:center; gap:3px; font-size:0.75em; font-weight:bold;">
      <span>Lote:</span>
      <select id="lote-promo" onchange="recalcularTotal()" style="padding: 3px; border-radius: 4px; border: 1px solid #ccc; font-size:0.9em; font-weight:bold;">
        <option value="2">Cada 2</option>
        <option value="3" selected>Cada 3</option>
      </select>
    </div>

    <div style="display:flex; align-items:center; gap:2px; font-size:0.75em; font-weight:bold;">
      <span>% Dto:</span>
      <input type="number" id="porcentaje-promo" value="30" min="1" max="100" oninput="recalcularTotal()" style="width: 42px; padding: 3px; text-align: center; border-radius: 4px; border: 1px solid #ccc; font-weight:bold;">
    </div>
  </div>
  
  <button onclick="procesarPago()" class="btn-cobrar">FINALIZAR VENTA</button>
</div>

<!-- BLOQUE DE CLIENTES -->
<div style="background: #e1f5fe; padding: 10px; border-top: 1px solid #b3e5fc; border-bottom: 1px solid #b3e5fc; display: flex; flex-direction: column; gap: 5px;">
  <div style="display: flex; gap: 5px;">
    <input type="number" id="cliente-cedula" placeholder="Cédula (Cliente Frecuente)" oninput="buscarCliente()" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #90caf9;">
    <button onclick="registrarCliente()" style="background: #0288d1; color: white; border: none; border-radius: 4px; padding: 0 12px; font-weight: bold; cursor: pointer;">💾 Guardar Cliente</button>
  </div>
  <div id="datos-cliente-extra" style="display: none; gap: 5px;">
    <input type="text" id="cliente-nombre" placeholder="Nombre completo" style="flex: 1; padding: 6px; font-size: 0.85em; border: 1px solid #ccc; border-radius: 4px;">
    <input type="email" id="cliente-correo" placeholder="Correo electrónico" style="flex: 1; padding: 6px; font-size: 0.85em; border: 1px solid #ccc; border-radius: 4px;">
  </div>
</div>

<div class="config-btn" onclick="toggleConfig()">⚙️ ADMINISTRACIÓN</div>

<div id="config">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e91e63; margin-bottom: 15px; padding-bottom: 10px;">
        <h2 style="margin: 0; color: #e91e63;">ADMINISTRACIÓN</h2>
        <button onclick="toggleConfig()" style="background: #333; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">X</button>
    </div>
